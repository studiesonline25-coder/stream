name: Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build StreamLite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore release keystore
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$ANDROID_SIGNING_KEY_BASE64" ]; then
            echo "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > app/release.keystore
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Check APK size
        run: |
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          bytes="$(stat -c%s "$apk")"
          limit="$((15 * 1024 * 1024))"
          echo "APK path: $apk"
          echo "APK size: $bytes bytes"
          test "$bytes" -le "$limit"

      - name: Verify APK signature
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$ANDROID_SIGNING_KEY_BASE64" ]; then
            apk="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
            apksigner verify --verbose --print-certs "$apk"
          else
            echo "Signing secrets are not configured; skipped signature verification."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: streamlite-release-apk
          path: app/build/outputs/apk/release/*.apk
